<!doctype html>
<html lang="fi" data-palette="herne" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vegesauruksen arkiruokia</title>
  <meta name="description" content="Suunnittele viikon kasvisruoat: seitsemän teemaa ja 14 ruokavaihtoehtoa jokaiselle päivälle.">
  <meta name="theme-color" content="#F5F8EF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arkiruokia">
  <script>
    // Asettaa väriteeman ennen ensimmäistä piirtoa, ettei sivu välähdä väärällä teemalla.
    (function () {
      var palette = 'herne', mode = 'system';
      try {
        var saved = JSON.parse(localStorage.getItem('vegesaurus-arkiruokia-v1'));
        if (saved && saved.palette) palette = saved.palette;
        if (saved && saved.mode) mode = saved.mode;
      } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' &&
        (palette === 'grafiitti' || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)));
      document.documentElement.setAttribute('data-palette', palette);
      document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Siirry sisältöön</a>

  <header class="app-header">
    <img class="app-logo" src="icons/icon.svg" alt="" width="40" height="40">
    <h1 class="app-title">Vegesauruksen arkiruokia</h1>
    <button type="button" class="icon-btn" id="settings-btn" aria-label="Asetukset">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Viikonpäivät ja viikon yhteenveto"></div>

  <div class="storage-warning" id="storage-warning" role="alert" hidden>
    Tietoja ei voi tallentaa tälle laitteelle, joten valinnat katoavat, kun suljet sivun.
    Tarkista, ettei selain ole yksityisessä tilassa.
  </div>

  <main class="view" id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">Sovellus tarvitsee toimiakseen JavaScriptin.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
